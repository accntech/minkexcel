name: Stage npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to stage on npm
        required: true
        type: string
        default: v0.1.1

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with staging support
        run: npm install --global npm@11.15.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Set package version from release tag and select npm tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, appendFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v?(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error('Release tag must be a version such as v0.1.1 or v0.2.0-beta.1');
          }
          execFileSync('npm', ['version', tag.replace(/^v/, ''), '--no-git-tag-version', '--allow-same-version'], { stdio: 'inherit' });
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const prerelease = process.env.RELEASE_PRERELEASE === 'true' || version.includes('-');
          appendFileSync(process.env.GITHUB_OUTPUT, `npm-tag=${prerelease ? 'next' : 'latest'}\n`);
          NODE

      - name: Install build tools
        run: bun install --cwd tools --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: bun run test

      - name: Build and check ExcelJS interoperability
        run: |
          bun run build
          bun run test:interop

      - name: Check consumer tree-shaking
        run: bun run test:treeshaking

      - name: Install Chromium
        run: bun tools/node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Check browser and Web Worker
        run: bun run test:browser

      - name: Check package contents
        run: npm pack --dry-run

      - name: Stage package for approval
        run: npm stage publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.release.outputs.npm-tag }}

      - name: Add approval instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          The npm release is staged and awaiting your approval.

          Open **Staged Packages** in your npm account, review `minkexcel`, and click **Approve** to publish it with 2FA.
          MARKDOWN
