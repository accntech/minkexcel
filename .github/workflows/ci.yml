name: Check package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install tools
        run: bun install --cwd tools --frozen-lockfile --ignore-scripts
      - name: Build and run unit tests
        run: |
          bun run build
          bun run test
      - name: Check consumer tree-shaking
        run: bun run test:treeshaking
      - name: Check ExcelJS interoperability and file integrity
        run: bun run test:interop
      - name: Install Chromium
        run: bun tools/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Check browser and Web Worker
        run: bun run test:browser
      - name: Check package contents
        run: npm pack --dry-run
